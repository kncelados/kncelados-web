name: scrape-latest-episode

on:
  schedule:
    - cron: "1 12 * * 2"
      timezone: "Europe/Madrid"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Scrape latest episode
        env:
          TOKEN: ${{ secrets.COHERE_TOKEN }}
        run: bun run scrape:latest

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/episodes scrape/episodes.js
          if git diff --cached --quiet; then
            echo "No hay cambios para commitear."
          else
            EPISODE=$(git diff --cached --name-only | head -1)
            git commit -m "scrape: nuevo episodio automático"
            git push
          fi
